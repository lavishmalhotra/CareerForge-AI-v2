<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep - CareerForge AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="/" class="wordmark">CareerForge AI</a>
        <nav class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
        </nav>
    </header>

    <main class="tool-page">
        <div class="tool-header" style="--tool-color: #C9553A; --tool-bg: rgba(201, 85, 58, 0.14);">
            <div class="tool-header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
            </div>
            <h1 class="tool-title">Interview Question Generator</h1>
        </div>
        <p class="tool-sub">Tell us the role you're preparing for.</p>

        <form action="/interview-prep" method="POST">
            <div class="form-group">
                <label for="role">Target Role</label>
                <input type="text" id="role" name="role" placeholder="e.g. Infosys Specialist Programmer" required>
            </div>
            <button type="submit" class="cta-button">Generate Questions</button>
        </form>
    </main>
</body>
</html>
