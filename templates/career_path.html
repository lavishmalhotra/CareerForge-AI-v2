<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path Suggester - CareerForge AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="/" class="wordmark">CareerForge AI</a>
        <nav class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
        </nav>
    </header>

    <main class="tool-page">
        <div class="tool-header" style="--tool-color: #E8873A; --tool-bg: rgba(232, 135, 58, 0.14);">
            <div class="tool-header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M12 3l8 4-8 4-8-4 8-4z"/>
                    <path d="M4 11v5c0 1.5 3.5 3 8 3s8-1.5 8-3v-5"/>
                </svg>
            </div>
            <h1 class="tool-title">Career Path Suggester</h1>
        </div>
        <p class="tool-sub">Fill the form manually, or upload your resume instead.</p>

        <form class="career-form" action="/career-path" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Lavish Malhotra">
            </div>
            <div class="form-group">
                <label for="education">Education</label>
                <input type="text" id="education" name="education" placeholder="e.g. B.Tech CSE, 3rd Year">
            </div>
            <div class="form-group">
                <label for="skills">Skills</label>
                <input type="text" id="skills" name="skills" placeholder="e.g. Python, SQL, OpenCV">
            </div>
            <div class="form-group">
                <label for="interests">Interests</label>
                <input type="text" id="interests" name="interests" placeholder="e.g. AI, Web Development">
            </div>
            <div class="form-divider">— or —</div>
            <div class="form-group">
                <label for="resume">Upload Resume (PDF)</label>
                <input type="file" id="resume" name="resume" accept=".pdf">
            </div>
            <button type="submit" class="cta-button">Get My Career Path</button>
        </form>
    </main>
</body>
</html>
