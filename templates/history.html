<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - CareerForge AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="/" class="wordmark">CareerForge AI</a>
        <nav class="nav-links">
            <a href="/dashboard">Dashboard</a>
        </nav>
    </header>

    <main class="results-page">
        <h1 class="results-title">Your History</h1>

        {% if records %}
            <div class="career-cards">
                {% for record in records %}
                <div class="career-card">
                    <div class="career-card-top">
                        <h2>{{ record.tool_type }}</h2>
                        <span class="match-badge">{{ record.created_at }}</span>
                    </div>
                    <p>{{ record.input_summary }}</p>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="error-message">No activity yet. Try one of the tools from your dashboard.</p>
        {% endif %}
    </main>
</body>
</html>
